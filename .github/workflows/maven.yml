name: Java CI with Maven

# Luồng này sẽ tự động chạy mỗi khi có Pull Request hoặc Push vào nhánh main/master
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Clone mã nguồn từ GitHub về máy ảo của GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt môi trường Java (JDK 17 - bạn thay đổi version phù hợp với dự án của mình)
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25' # Thay đổi từ 17 thành 25 ở đây
          distribution: 'temurin'
          cache: maven

      # Bước 3: Biên dịch dự án và chạy toàn bộ các bài test JUnit tự động
      - name: Build and Run Tests with Maven
        run: mvn clean test

      # [BƯỚC CD 1] - Nếu test pass, tiến hành đóng gói ra file .jar
      - name: Package Application (CD)
        run: mvn package -DskipTests # Bỏ qua bước test vì đã chạy ở trên rồi, giúp build nhanh hơn

      # [BƯỚC CD 2] - Đẩy file .jar vừa build xong lên mục Artifacts của GitHub
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bidding-System-Executable # Tên của file khi tải về trên web
          path: target/*.jar # Đường dẫn tới file .jar mà Maven vừa tạo ra